name: Lint, Type Check & Build

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd packages/prisma && npm run db:generate

      - name: Build packages
        run: npx turbo run build --filter='./packages/*'

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,json,md}"

      - name: Type check
        run: npx turbo run check-types

      - name: Build
        run: npx turbo run build
